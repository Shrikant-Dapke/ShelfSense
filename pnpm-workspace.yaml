packages:
  - "client"
  - "server"

# Native/postinstall builds required for Prisma engines and esbuild binaries.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
